name: verify

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  invariants:
    name: analysis invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify every figure cited by the film
        run: python3 analysis/tools/00_verify.py

  typescript:
    name: film typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Scene registry
        run: npx tsx src/render.ts --list
